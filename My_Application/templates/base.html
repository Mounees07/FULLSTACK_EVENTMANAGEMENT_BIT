{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Event Management Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    <script src="{% static 'js/script.js' %}"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <nav class="sidebar">
          <h2>Event Management</h2>
          <ul>
            <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
            <li><a href="{% url 'profile' %}">Profile</a></li>
            <li><a href="{% url 'uploaded-events' %}">Uploaded Events</a></li>
            <li><a href="{% url 'events' %}">Events</a></li>
            <li><a href="{% url 'venues-available' %}">Venues Available</a></li>
            <li><a href="{% url 'approved-events' %}">Approved Events</a></li>
            <li><a href="{% url 'ongoing-events' %}">Ongoing Events</a></li>
            <li><a href="{% url 'reports' %}">Reports</a></li>
          </ul>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Navbar -->
            <div class="navbar">
                {% include 'navbar.html' %}
            </div>

            <!-- Content Section -->
            <section class="content-section">
                {% block content %}
                {% endblock %}
            </section>
        </div>
    </div>
</body>
</html>
